name: Build HearIt APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download YAMNet TFLite Music Gatekeeper
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/yamnet.tflite \
            "https://huggingface.co/litert-community/MediaPipe-AudioClassifier-YAMNet/resolve/main/yamnet.tflite"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK (arm64-v8a)
        run: gradle assembleRelease --no-daemon

      - name: Upload HearIt APK
        uses: actions/upload-artifact@v4
        with:
          name: HearIt-v1.0.0-arm64
          path: app/build/outputs/apk/release/app-release.apk
